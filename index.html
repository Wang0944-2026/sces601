<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>僑平國小 605 聯絡簿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .homework-item {
            transition: all 0.3s ease;
        }
        .homework-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .sync-indicator {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .saving-overlay, .date-picker-overlay, .password-dialog-overlay, .marquee-list-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .saving-dialog, .date-picker-dialog, .marquee-list-dialog {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
        }
        .date-picker-dialog {
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .date-picker-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .date-picker-input:focus {
            border-color: #6366f1;
        }
        .homework-confirmed {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            border: 2px solid #10b981;
        }
        .homework-pending {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 2px solid #f59e0b;
        }
        .homework-editing {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            border: 2px solid #6b7280;
        }
        
        /* 聯絡簿拖拽排序樣式 */
        .sortable-item {
            cursor: move;
            transition: all 0.2s ease;
        }
        .sortable-item:hover { transform: translateY(-1px); }
        .sortable-item.dragging {
            opacity: 0.5;
            transform: rotate(2deg);
            z-index: 1000;
        }
        .sortable-item.drag-over { border-top: 3px solid #6366f1; }
        .drag-handle {
            cursor: grab;
            color: #9ca3af;
            transition: color 0.2s;
        }
        .drag-handle:hover { color: #6366f1; }
        .drag-handle:active { cursor: grabbing; }
        .sort-mode-indicator {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 2px solid #f59e0b;
            border-radius: 12px;
            padding: 8px 16px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 600;
            color: #92400e;
        }

        /* 跑馬燈拖拽排序樣式 */
        .global-sortable-item {
            cursor: move;
            transition: all 0.2s ease;
        }
        .global-sortable-item:hover { transform: translateY(-1px); }
        .global-sortable-item.dragging {
            opacity: 0.5;
            transform: rotate(2deg);
            z-index: 1000;
        }
        .global-sortable-item.drag-over { border-top: 3px solid #eab308; }
        .global-drag-handle {
            cursor: grab;
            color: #9ca3af;
            transition: color 0.2s;
        }
        .global-drag-handle:hover { color: #ca8a04; }
        .global-drag-handle:active { cursor: grabbing; }
        
        /* 跑馬燈動畫 */
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
        }
        .marquee-wrapper {
            overflow: hidden;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .marquee-content {
            display: flex;
            white-space: nowrap;
            width: max-content;
            animation-name: scroll;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        .marquee-wrapper:hover .marquee-content {
            animation-play-state: paused;
        }
        .marquee-item-group {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            min-width: 100%;
        }

        /* 跑馬燈列表自訂滾動條 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>

    <script>
        let currentDate = new Date();
        let homeworkCounter = 0;
        let editMode = false;
        let isSaving = false;
        let homeworkData = []; 
        
        let globalConfig = { marqueeSpeed: 200, password: '0944' }; 
        let globalEvents = [
            { id: 'e1', type: 'countdown', name: '第一次定期評量 (4/16-17)', date: '2026-04-16', enabled: true },
            { id: 'e2', type: 'countdown', name: '全台學力檢測 (5/28)', date: '2026-05-28', enabled: true }
        ];
        
        let currentGlobalDataString = null;
        let currentlyFocusedInputId = null; 
        let currentlyFocusedCursorPos = null;

        const firstSemesterStart = new Date('2026-08-31');
        const firstSemesterEnd = new Date('2027-01-20');
        const secondSemesterStart = new Date('2027-02-11');
        const secondSemesterEnd = new Date('2027-06-30');

        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQGDUGy9WWRTRYarvab7F-bFZBqeVaT2mhu4lC0L7OQ-iwoTUU1bexXJLSXaSfiil_Qg/exec';

        const CACHE_CONFIG = {
            TTL: 12 * 60 * 60 * 1000, 
            CLASS_ID: '605',
            VERSION: '2.7.0',
            BACKGROUND_UPDATE_INTERVAL: 5000, 
            BACKGROUND_UPDATE_ENABLED: true 
        };

        const memoryCache = new Map();
        const inflightRequests = new Map();
        let currentLoadController = null;
        let backgroundUpdateTimer = null;
        let isBackgroundUpdating = false;

        function dateKeyISO(d) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function parseRawData(rawData) {
            if (typeof rawData === 'string') {
                try { 
                    return JSON.parse(rawData); 
                } catch (e) { 
                    try {
                        let lines = rawData.split('\n').map(l => l.trim()).filter(l => l);
                        if (lines.length > 0 && !rawData.startsWith('[{')) {
                            return lines.map(line => ({ content: line, subject: '其它', status: 'confirmed' }));
                        }
                        
                        let cleanStr = rawData.replace(/[\n\r\t]/g, ' ');
                        return JSON.parse(cleanStr);
                    } catch(e2) {
                        return [];
                    }
                }
            }
            return rawData || [];
        }

        class CacheItem {
            constructor(data, hash = null) {
                this.data = data;
                this.cachedAt = Date.now();
                this.hash = hash || this.calculateHash(data);
                this.version = CACHE_CONFIG.VERSION;
            }
            calculateHash(data) {
                const str = JSON.stringify(data);
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash; 
                }
                return hash.toString(36);
            }
            isExpired() { return (Date.now() - this.cachedAt) > CACHE_CONFIG.TTL; }
            isValidVersion() { return this.version === CACHE_CONFIG.VERSION; }
        }

        function getCacheKey(dateKey) { return `hw:${CACHE_CONFIG.CLASS_ID}:${dateKey}`; }
        function getFromMemoryCache(dateKey) {
            const cacheKey = getCacheKey(dateKey);
            const item = memoryCache.get(cacheKey);
            if (!item || item.isExpired() || !item.isValidVersion()) { memoryCache.delete(cacheKey); return null; }
            return item;
        }
        function writeToCache(dateKey, data, hash = null) {
            const cacheKey = getCacheKey(dateKey);
            const item = new CacheItem(data, hash);
            memoryCache.set(cacheKey, item);
        }

        function calculateStableHash(rawData) {
            let parsedData = parseRawData(rawData);
            if (!Array.isArray(parsedData)) return 'empty';
            const stableContent = parsedData.map(item => {
                if (typeof item === 'string') return { content: item.trim() };
                else if (item && typeof item === 'object') return { content: (item.text || item.content || item.homework || '').toString().trim() };
                return null;
            }).filter(Boolean);
            const str = JSON.stringify(stableContent);
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash = hash & hash;
            }
            return hash.toString(36);
        }

        function showToast(msg, type = 'success') {
            let n = document.getElementById('notification');
            if (!n) {
                n = document.createElement('div');
                n.id = 'notification';
                document.body.appendChild(n);
            }
            n.className = `fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg z-50 transition-all duration-300 ${type === 'success' ? 'bg-green-100 text-green-800 border border-green-200' : type === 'error' ? 'bg-red-100 text-red-800 border border-red-200' : type === 'warning' ? 'bg-yellow-100 text-yellow-800 border border-yellow-200' : 'bg-blue-100 text-blue-800 border border-blue-200'}`;
            n.innerHTML = `<div class="flex items-center space-x-2"><span class="text-lg">${type==='success'?'✅':type==='error'?'❌':type==='warning'?'⚠️':'ℹ️'}</span><span class="font-medium text-sm sm:text-base">${msg}</span></div>`;
            n.style.opacity = '1'; n.style.transform = 'translateY(0)';
            setTimeout(() => { n.style.opacity = '0'; n.style.transform = 'translateY(-20px)'; setTimeout(() => n.remove(), 300); }, 3000);
        }

        async function performBackgroundUpdate() {
            if (isBackgroundUpdating) return;
            isBackgroundUpdating = true;
            try {
                const dateKey = dateKeyISO(currentDate);
                
                if (editMode) {
                    const currentDataHash = calculateStableHash(homeworkData);
                    const cacheItem = getFromMemoryCache(dateKey);
                    if (!cacheItem || cacheItem.hash !== currentDataHash) {
                        const legacyData = homeworkData.map(hw => ({ text: hw.content, subject: hw.subject, confirmed: hw.status === 'confirmed', timestamp: hw.timestamp }));
                        const saveRes = await saveToGoogleSheets(dateKey, legacyData);
                        if(saveRes.success) {
                            writeToCache(dateKey, normalizeHomeworkData(legacyData), currentDataHash);
                        }
                    }
                    return; 
                }

                const cacheItem = getFromMemoryCache(dateKey);
                const cloudResult = await loadFromCloudWithCache(dateKey, true);
                
                let shouldUpdateUI = false;
                if (cloudResult && cloudResult.data !== undefined) {
                    if (!cacheItem || cacheItem.hash !== cloudResult.hash) {
                        shouldUpdateUI = true;
                    }
                }

                if (shouldUpdateUI) {
                    homeworkData = [...cloudResult.data];
                    renderAllHomework();
                }
            } catch (error) {
                // Ignore silent errors
            } finally {
                isBackgroundUpdating = false;
            }
        }

        function startBackgroundUpdate() {
            if (!CACHE_CONFIG.BACKGROUND_UPDATE_ENABLED) return;
            stopBackgroundUpdate();
            backgroundUpdateTimer = setInterval(() => { if (document.visibilityState === 'visible') performBackgroundUpdate(); }, CACHE_CONFIG.BACKGROUND_UPDATE_INTERVAL);
        }

        function stopBackgroundUpdate() {
            if (backgroundUpdateTimer) { clearInterval(backgroundUpdateTimer); backgroundUpdateTimer = null; }
        }

        class HomeworkItem {
            constructor(id, subject, content, status = 'editing', timestamp = null) {
                this.id = id || `hw_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                this.subject = subject || '國語';
                this.content = content || '';
                this.status = status;
                this.timestamp = timestamp || new Date().toISOString();
            }
        }

        function generateStableId(subject, content, index) {
            const baseStr = `${subject}|${content}|${index}`;
            let hash = 0;
            for (let i = 0; i < baseStr.length; i++) {
                hash = ((hash << 5) - hash) + baseStr.charCodeAt(i);
                hash = hash & hash;
            }
            return `hw_${hash.toString(36)}`;
        }

        function normalizeHomeworkData(rawData) {
            let parsedData = parseRawData(rawData);
            if (!Array.isArray(parsedData)) return [];
            return parsedData.map((item, index) => {
                let content = '', subject = '國語', status = 'confirmed', timestamp = null;
                if (typeof item === 'string') content = item.trim();
                else if (item && typeof item === 'object') {
                    content = (item.text || item.content || item.homework || '').toString().trim();
                    subject = item.subject || item.subj || '國語';
                    status = (item.confirmed === true || item.status === 'confirmed') ? 'confirmed' : (item.status === 'editing' ? 'editing' : 'confirmed');
                    timestamp = item.timestamp || item.time || null;
                }
                if (content) return new HomeworkItem(generateStableId(subject, content, index), subject, content, status, timestamp);
                return null;
            }).filter(Boolean);
        }

        let draggedElement = null, draggedHomeworkId = null;
        function handleDragStart(e) {
            const item = e.target.closest('.sortable-item');
            if (!item) return;
            draggedElement = item; draggedHomeworkId = item.dataset.homeworkId;
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', draggedHomeworkId);
        }
        function handleDragEnd(e) {
            if (draggedElement) { draggedElement.classList.remove('dragging'); draggedElement.setAttribute('draggable', 'false'); }
            document.querySelectorAll('.sortable-item').forEach(i => i.classList.remove('drag-over'));
            draggedElement = null; draggedHomeworkId = null;
        }
        function handleDragOver(e) {
            e.preventDefault(); e.stopPropagation();
            if (!draggedElement) return;
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.sortable-item');
            if (target && target !== draggedElement) {
                document.querySelectorAll('.sortable-item').forEach(i => i.classList.remove('drag-over'));
                target.classList.add('drag-over');
            }
        }
        function handleDrop(e) {
            e.preventDefault(); e.stopPropagation();
            if (!draggedElement || !draggedHomeworkId) return;
            const target = e.target.closest('.sortable-item');
            if (target && target !== draggedElement) {
                const targetId = target.dataset.homeworkId;
                const draggedIdx = homeworkData.findIndex(hw => hw.id === draggedHomeworkId);
                const targetIdx = homeworkData.findIndex(hw => hw.id === targetId);
                if (draggedIdx > -1 && targetIdx > -1) {
                    const item = homeworkData.splice(draggedIdx, 1)[0];
                    homeworkData.splice(targetIdx, 0, item);
                    item.timestamp = new Date().toISOString();
                    renderAllHomework();
                }
            }
            document.querySelectorAll('.sortable-item').forEach(i => i.classList.remove('drag-over'));
        }

        async function loadGlobalEvents() {
            try {
                const params = new URLSearchParams({ action: 'loadGlobal', classId: CACHE_CONFIG.CLASS_ID, token: 'homework2025', _t: Date.now() });
                const response = await fetch(`${APPS_SCRIPT_URL}?${params.toString()}`);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const responseText = await response.text();
                if (responseText.trim().startsWith('<')) { throw new Error('HTML_RETURNED'); }
                
                const result = JSON.parse(responseText);
                if (result.success && result.data) {
                    const parsedData = parseRawData(result.data);
                    const safeObj = (parsedData && typeof parsedData === 'object' && !Array.isArray(parsedData)) ? parsedData : {};
                    currentGlobalDataString = typeof result.data === 'string' ? result.data : JSON.stringify(result.data);

                    if (safeObj.events) globalEvents = safeObj.events;
                    if (safeObj.config) {
                        globalConfig = safeObj.config;
                        let speed = parseInt(globalConfig.marqueeSpeed, 10);
                        globalConfig.marqueeSpeed = (isNaN(speed) || speed < 50) ? 200 : (speed > 400 ? 400 : speed);
                        if(!globalConfig.password) globalConfig.password = '0944';
                    }

                    updateCountdown(new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()).getTime());
                    if (editMode) {
                        renderGlobalEventsEditor();
                        const slider = document.getElementById('marqueeSpeedSlider');
                        const display = document.getElementById('speedValueDisplay');
                        if (slider && display) {
                            slider.value = globalConfig.marqueeSpeed;
                            display.textContent = globalConfig.marqueeSpeed + 's';
                        }
                    }
                }
            } catch (e) {
                if (e.message === 'HTML_RETURNED') { console.warn('後端 API 權限設定錯誤'); } 
                else { console.warn('無法載入獨立跑馬燈設定。', e); }
            }
        }

        async function saveToGoogleSheets(dateKey, data) {
            try {
                const formData = new FormData();
                formData.append('action', 'save');
                formData.append('dateKey', dateKey); 
                formData.append('classId', CACHE_CONFIG.CLASS_ID);
                formData.append('data', JSON.stringify(data));
                formData.append('token', 'homework2025');
                formData.append('userAgent', navigator.userAgent || "Unknown Browser");

                const response = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: formData, cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (e) {
                    if (responseText.toLowerCase().includes('success')) { result = { success: true }; } 
                    else { throw new Error('伺服器回傳格式錯誤'); }
                }
                
                if (result.success || result.status === 'success') return { success: true, message: '作業已成功儲存' };
                else throw new Error(result.error || '儲存失敗');
            } catch (e) { return { success: false, message: e.message }; }
        }

            if (inflightRequests.has(dateKey)) return await inflightRequests.get(dateKey);
            
            const loadPromise = (async () => {
                let controller = new AbortController();
                let timeoutId = setTimeout(() => controller.abort(), 15000);
                if (!isPrefetch) {
                    if (currentLoadController) currentLoadController.abort();
                    currentLoadController = controller;
                }
                try {
                    const params = new URLSearchParams({ action: 'load', dateKey, classId: CACHE_CONFIG.CLASS_ID, token: 'homework2025', _t: Date.now() });
                    const response = await fetch(`${APPS_SCRIPT_URL}?${params.toString()}`, { signal: controller.signal, cache: 'no-store' });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const responseText = await response.text();
                    if (responseText.trim().startsWith('<')) { throw new Error('HTML_RETURNED'); }
                    const result = JSON.parse(responseText);
                    
                    if (result.success || result.data) {
                        let rawData = result.data || [];
                        const normalizedData = normalizeHomeworkData(rawData);
                        const hash = result.hash || calculateStableHash(rawData);
                        writeToCache(dateKey, normalizedData, hash);
                        return { data: normalizedData, hash, fromCloud: true };
                    } else throw new Error(result.error || '載入失敗');
                } catch (e) {
                    if (e.name === 'AbortError') throw e; 
                    throw e; 
                } finally {
                    clearTimeout(timeoutId);
                    if (!isPrefetch && currentLoadController === controller) currentLoadController = null;
                }
            })();
            
            inflightRequests.set(dateKey, loadPromise);
            try { return await loadPromise; } finally { inflightRequests.delete(dateKey); }
        }

        async function loadHomeworkWithSWR(dateKey) {
            let cacheItem = getFromMemoryCache(dateKey);
            if (cacheItem && cacheItem.data) {
                if (dateKeyISO(currentDate) === dateKey) { homeworkData = [...cacheItem.data]; renderAllHomework(); }
            } else { homeworkData = []; renderAllHomework(true); }
            
            try {
                let cloudResult = await loadFromCloudWithCache(dateKey);
                
                if (!cloudResult || !cloudResult.data || cloudResult.data.length === 0) {
                    const unpadMonth = currentDate.getMonth() + 1;
                    const unpadDay = currentDate.getDate();
                    const unpaddedKey = `${currentDate.getFullYear()}-${unpadMonth}-${unpadDay}`;
                    if (unpaddedKey !== dateKey) {
                        try {
                            const fallbackResult = await loadFromCloudWithCache(unpaddedKey, true);
                            if (fallbackResult && fallbackResult.data && fallbackResult.data.length > 0) cloudResult = fallbackResult;
                        } catch(e) {}
                    }
                }
                
                if (dateKeyISO(currentDate) !== dateKey) return; 
                if ((!cacheItem || cacheItem.hash !== cloudResult.hash) && cloudResult.data !== undefined) {
                    homeworkData = [...cloudResult.data]; renderAllHomework();
                }
            } catch (e) {
                if (e.name !== 'AbortError' && e.message === 'HTML_RETURNED') { showToast('載入失敗：後端 API 權限設定錯誤！請檢查 GAS 部署權限是否為「所有人」。', 'error'); }
                if (dateKeyISO(currentDate) !== dateKey) return; 
                if (!cacheItem) { homeworkData = []; renderAllHomework(); }
            }
        }

        async function saveHomeworkInstantly() {
            if (isSaving) return { success: false, message: '正在儲存中' };
            isSaving = true;
            try {
                const dateKey = dateKeyISO(currentDate);
                const legacyData = homeworkData.map(hw => ({ text: hw.content, subject: hw.subject, confirmed: hw.status === 'confirmed', timestamp: hw.timestamp }));
                const result = await saveToGoogleSheets(dateKey, legacyData);
                if (result.success) writeToCache(dateKey, normalizeHomeworkData(legacyData), calculateStableHash(legacyData));
                return result;
            } finally { isSaving = false; }
        }

        async function loadHomework() { await loadHomeworkWithSWR(dateKeyISO(currentDate)); }

        async function toggleEditMode() {
            if (!editMode) { showCustomPasswordDialog(); return; }

            homeworkData.forEach(hw => {
                if (hw.status === 'editing') {
                    if (hw.content.trim()) hw.status = 'confirmed';
                    else homeworkData = homeworkData.filter(h => h.id !== hw.id);
                }
            });

            setEditBtnBusy(true);

            let saveResult;
            try {
                saveResult = await saveHomeworkInstantly();
                await saveGlobalEventsInstantly(); 
            } catch (e) {
                saveResult = { success: false, message: '儲存錯誤' };
            }

            setEditBtnBusy(false);

            if (saveResult && saveResult.success) {
                editMode = false;
                updateEditModeUI();
                setTimeout(async () => { await manualRefresh(true); }, 500);
            } else { showToast(saveResult?.message || '儲存失敗', 'error'); }
        }

        function updateEditModeUI() {
            const btn = document.getElementById('editModeBtn');
            if (editMode) {
                document.getElementById('editIcon').textContent = '🔓'; document.getElementById('editText').textContent = '退出編輯';
                btn.className = 'group relative w-full sm:w-auto bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white px-4 py-2 rounded-xl shadow-lg flex justify-center items-center space-x-2';
                document.getElementById('addHomeworkBtn').style.display = 'flex';
                document.getElementById('marqueeEditSection').style.display = 'block';
                document.getElementById('sortModeIndicator').style.display = 'block';
                renderGlobalEventsEditor(); stopBackgroundUpdate();
            } else {
                document.getElementById('editIcon').textContent = '🔐'; document.getElementById('editText').textContent = '編輯模式';
                btn.className = 'group relative w-full sm:w-auto bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white px-4 py-2 rounded-xl shadow-lg flex justify-center items-center space-x-2';
                document.getElementById('addHomeworkBtn').style.display = 'none';
                document.getElementById('marqueeEditSection').style.display = 'none';
                document.getElementById('sortModeIndicator').style.display = 'none';
                startBackgroundUpdate();
            }
        }

        function showCustomPasswordDialog() {
            const overlay = document.createElement('div');
            overlay.className = 'password-dialog-overlay';
            overlay.innerHTML = `<div class="bg-white rounded-xl p-6 shadow-2xl max-w-sm w-full mx-4"><h3 class="text-xl font-bold text-center mb-4">🔐 請輸入系統密碼</h3><input type="password" id="customPasswordInput" placeholder="請輸入密碼..." class="w-full border border-gray-300 rounded-lg p-3 text-center text-lg font-medium mb-4 outline-none focus:ring-2 focus:ring-indigo-500"><div class="flex gap-3"><button onclick="document.querySelector('.password-dialog-overlay').remove()" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-2 rounded-lg font-medium transition-colors">取消</button><button onclick="confirmPassword()" class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white py-2 rounded-lg font-medium transition-colors">確認</button></div></div>`;
            document.body.appendChild(overlay);
            setTimeout(() => { const i = document.getElementById('customPasswordInput'); i.focus(); i.onkeypress = e => { if(e.key==='Enter') confirmPassword(); }; }, 100);
        }

        function confirmPassword() {
            const input = document.getElementById('customPasswordInput');
            const targetPass = globalConfig.password || '0944';
            if (input?.value === targetPass) {
                editMode = true; updateEditModeUI(); document.querySelector('.password-dialog-overlay').remove();
                showToast('已進入編輯模式', 'success'); renderAllHomework();
            } else { showToast('密碼錯誤！', 'error'); input.value = ''; input.focus(); }
        }

        function setEditBtnBusy(busy) {
            const btn = document.getElementById('editModeBtn');
            btn.disabled = busy;
            btn.querySelector('[data-role="btn-content"]').classList.toggle('hidden', busy);
            btn.querySelector('[data-role="spinner"]').classList.toggle('hidden', !busy);
        }

        async function manualRefresh(silent = false) {
            const refreshIcon = document.getElementById('refreshIcon');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');
            
            const dateKey = dateKeyISO(currentDate);
            memoryCache.delete(getCacheKey(dateKey));
            
            try {
                if (currentLoadController) currentLoadController.abort();
                let cloudResult = await loadFromCloudWithCache(dateKey);
                
                if (!cloudResult || !cloudResult.data || cloudResult.data.length === 0) {
                    const padMonth = String(currentDate.getMonth() + 1).padStart(2, '0');
                    const padDay = String(currentDate.getDate()).padStart(2, '0');
                    const unpadMonth = currentDate.getMonth() + 1;
                    const unpadDay = currentDate.getDate();
                    
                    const paddedKey = `${currentDate.getFullYear()}-${padMonth}-${padDay}`;
                    const unpaddedKey = `${currentDate.getFullYear()}-${unpadMonth}-${unpadDay}`;
                    let targetFallback = (dateKey === paddedKey) ? unpaddedKey : paddedKey;
                    
                    try {
                        const fallbackResult = await loadFromCloudWithCache(targetFallback, true);
                        if (fallbackResult && fallbackResult.data && fallbackResult.data.length > 0) cloudResult = fallbackResult;
                    } catch(e) {}
                }
                
                if (dateKeyISO(currentDate) === dateKey) {
                    homeworkData = [...cloudResult.data]; renderAllHomework();
                    await loadGlobalEvents(); 
                    if (!silent) showToast('資料已更新至最新！', 'success');
                }
            } catch (e) { 
                if (e.name !== 'AbortError') {
                    if (e.message === 'HTML_RETURNED') { showToast('載入失敗：後端 API 權限設定錯誤！請檢查是否設為「所有人」。', 'error'); }
                    else if (!silent) { showToast('載入失敗，請稍後重試', 'error'); }
                }
                if (dateKeyISO(currentDate) === dateKey && e.name !== 'AbortError') {
                    homeworkData = []; renderAllHomework(); 
                }
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            }
        }

        function showMarqueeList() {
            if (!globalEvents || globalEvents.length === 0) return showToast('目前沒有跑馬燈訊息', 'warning');
            
            const overlay = document.createElement('div');
            overlay.className = 'marquee-list-overlay';
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
            
            const tDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()).getTime();

            let listHTML = globalEvents.filter(ev => ev.enabled !== false).map(ev => {
                if (ev.type === 'message' && ev.content?.trim()) {
                    return `<div class="p-2 sm:p-3 bg-slate-50 border border-slate-200 rounded-lg mb-2 shadow-sm flex items-center gap-2 hover:bg-slate-100 transition-colors w-full">
                                <span class="text-xl shrink-0 pl-1">📢</span>
                                <div class="font-bold text-slate-700 truncate min-w-0 flex-1 text-left" title="${ev.content}">${ev.content}</div>
                            </div>`;
                } else if (ev.type === 'countdown') {
                    const isRange = ev.isRange === true;
                    let dateDisplay = '';
                    let targetTime = tDay;

                    if (isRange && ev.startDate && ev.endDate) {
                        const [sy, sm, sd] = ev.startDate.split('-');
                        const [ey, em, ed] = ev.endDate.split('-');
                        dateDisplay = `${sy}/${sm}/${sd} ~ ${ey}/${em}/${ed}`;
                        targetTime = new Date(parseInt(sy), parseInt(sm)-1, parseInt(sd), 12, 0, 0).getTime();
                    } else if (ev.date) {
                        const [y, m, d] = ev.date.split('-');
                        dateDisplay = `${y}/${m}/${d}`;
                        const evDate = new Date(parseInt(y), parseInt(m)-1, parseInt(d), 12, 0, 0).getTime();
                        targetTime = new Date(new Date(evDate).getFullYear(), new Date(evDate).getMonth(), new Date(evDate).getDate()).getTime();
                    }
                    
                    let days = Math.floor((targetTime - tDay) / 86400000);
                    
                    if (days < 0) return ''; 

                    let daysText = `<span class="whitespace-nowrap">還有 <span class="text-xl text-red-500 font-black mx-1">${days}</span> 天</span>`;

                    if (ev.name) {
                        return `<div class="p-2 sm:p-3 bg-yellow-50 border border-yellow-200 rounded-lg mb-2 shadow-sm flex items-center gap-2 sm:gap-3 hover:bg-yellow-100 transition-colors w-full">
                                    <span class="text-xl shrink-0 pl-1">🌟</span>
                                    <div class="font-bold text-yellow-900 text-sm sm:text-base truncate min-w-0 flex-1 text-left" title="${ev.name}">${ev.name}</div>
                                    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                                        <div class="text-sm sm:text-base font-medium text-slate-600 bg-white/60 px-2 rounded hidden sm:block">${dateDisplay}</div>
                                        <div class="shrink-0">${daysText}</div>
                                    </div>
                                </div>`;
                    }
                }
                return '';
            }).join('');
            
            if(!listHTML.trim()) listHTML = '<div class="text-center text-slate-500 py-4 font-bold">目前沒有生效或即將到來的活動訊息</div>';
            
            overlay.innerHTML = `
                <div class="marquee-list-dialog relative flex flex-col" style="max-width: 900px; width: 95%;">
                    <button onclick="document.querySelector('.marquee-list-overlay').remove()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-3xl font-bold leading-none bg-slate-100 rounded-full w-10 h-10 flex items-center justify-center transition-colors z-20">×</button>
                    <h3 class="text-xl sm:text-2xl font-bold mb-4 text-slate-800 flex items-center pr-10"><span class="mr-2">📋</span> 跑馬燈與活動列表</h3>
                    <div class="overflow-y-auto pr-2 space-y-2 custom-scrollbar" style="max-height: 75vh;">
                        ${listHTML}
                    </div>
                </div>`;
            document.body.appendChild(overlay);
        }

        function updateCountdown(currentDayTime) {
            const countdownMarquee = document.getElementById('countdownMarquee');
            const marqueeText = document.getElementById('marqueeText');
            if (!globalEvents || globalEvents.length === 0) { countdownMarquee.style.display = 'none'; return; }

            let msgs = [];
            for (const ev of globalEvents) {
                if (ev.enabled === false) continue;
                if (ev.type === 'message' && ev.content?.trim()) { msgs.push(`📢 ${ev.content}`); } 
                else if (ev.type === 'countdown' && ev.name) {
                    const isRange = ev.isRange === true;
                    let targetTime = null;
                    if (isRange && ev.startDate) {
                         const [y, m, d] = ev.startDate.split('-');
                         targetTime = new Date(parseInt(y), parseInt(m)-1, parseInt(d), 12, 0, 0).getTime();
                    } else if (!isRange && ev.date) {
                         const [y, m, d] = ev.date.split('-');
                         targetTime = new Date(parseInt(y), parseInt(m)-1, parseInt(d), 12, 0, 0).getTime();
                    }
                    if (!targetTime) continue;
                    
                    const eDay = new Date(new Date(targetTime).getFullYear(), new Date(targetTime).getMonth(), new Date(targetTime).getDate()).getTime();
                    const tDay = new Date(new Date(currentDayTime).getFullYear(), new Date(currentDayTime).getMonth(), new Date(currentDayTime).getDate()).getTime();
                    
                    const days = Math.floor((eDay - tDay) / 86400000);
                    if (days >= 0) {
                        msgs.push(`📢 🌟 提醒：【${ev.name}】還有 <span class="text-2xl text-red-500 font-black mx-2">${days}</span> 天！`);
                    }
                }
            }

            if (msgs.length > 0) {
                countdownMarquee.style.display = 'flex';
                const baseMsg = msgs.join('<span class="mx-8 text-yellow-400 font-normal">|</span>') + '<span class="mx-8 text-yellow-400 font-normal">|</span>';
                
                const rawText = baseMsg.replace(/<[^>]*>?/gm, '');
                const charCount = rawText.length || 1;
                
                const copies = 20;
                const crossedCopies = copies / 2;
                const totalCrossedChars = charCount * crossedCopies;
                
                const speedSetting = Math.max(50, Math.min(400, globalConfig.marqueeSpeed || 200));
                
                const referenceChars = 300;
                const calculatedDuration = (totalCrossedChars / referenceChars) * speedSetting;

                const repeatedMsg = Array(copies).fill(baseMsg).join('');
                const groupHTML = `<div class="marquee-item-group">${repeatedMsg}</div>`;
                
                marqueeText.className = 'marquee-content text-base sm:text-lg font-bold text-yellow-800';
                marqueeText.style.animationDuration = `${calculatedDuration}s`;
                marqueeText.innerHTML = groupHTML + groupHTML;
            } else { countdownMarquee.style.display = 'none'; }
        }

        function updateDateDisplaySync() {
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            let semInfo = '', weekNum = 1;
            const stripTime = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
            const curr = stripTime(currentDate), s1Start = stripTime(firstSemesterStart), s1End = stripTime(firstSemesterEnd), s2Start = stripTime(secondSemesterStart), s2End = stripTime(secondSemesterEnd);

            if (curr >= s1Start && curr <= s1End) {
                semInfo = '115學年第一學期';
                weekNum = Math.max(1, Math.min(21, Math.floor((curr - new Date(2026, 7, 30).getTime()) / 86400000 / 7) + 1));
            } else if (curr >= s2Start && curr <= s2End) {
                semInfo = '115學年第二學期';
                weekNum = Math.max(1, Math.min(21, Math.floor((curr - new Date(2027, 1, 7).getTime()) / 86400000 / 7) + 1));
            } else if (curr < s1Start) { semInfo = '115學年第一學期'; } 
            else if (curr > s1End && curr < s2Start) { semInfo = '115學年寒假'; } 
            else { semInfo = '115學年暑假'; }

            document.getElementById('semesterInfo').textContent = semInfo;
            document.getElementById('weekInfo').textContent = `第${weekNum}週`;
            document.getElementById('dateOnly').textContent = `${currentDate.getFullYear()}年${currentDate.getMonth() + 1}月${currentDate.getDate()}日`;
            document.getElementById('weekdayOnly').textContent = weekdays[currentDate.getDay()];
            
            const m = (currentDate.getMonth() + 1).toString();
            const d = currentDate.getDate().toString();
            const isToday = dateKeyISO(currentDate) === dateKeyISO(new Date());
            document.getElementById('homeworkTitle').textContent = isToday ? '今日作業' : `${m}月${d}日 作業`;
            
            updateCountdown(curr);
        }

        function updateDateDisplay() {
            updateDateDisplaySync();
            requestAnimationFrame(() => loadHomework().catch(e => console.error(e)));
        }

        let navLocked = false;
        function moveDay(step) {
            if (navLocked) return; navLocked = true; setTimeout(() => navLocked = false, 300);
            do {
                currentDate.setDate(currentDate.getDate() + step);
                if (currentDate < firstSemesterStart) { currentDate = new Date(firstSemesterStart); break; }
                if (currentDate > secondSemesterEnd) { currentDate = new Date(secondSemesterEnd); break; }
            } while (currentDate.getDay() === 0 || currentDate.getDay() === 6);
            updateDateDisplay();
        }
        function previousDay() { moveDay(-1); }
        function nextDay() { moveDay(1); }
        function today() {
            if (navLocked) return; navLocked = true; setTimeout(() => navLocked = false, 300);
            currentDate = new Date(); 
            if (currentDate.getDay() === 0 || currentDate.getDay() === 6) moveDay(1); 
            else updateDateDisplay();
        }

        function showDatePicker() {
            const overlay = document.createElement('div'); overlay.className = 'date-picker-overlay';
            overlay.innerHTML = `<div class="date-picker-dialog"><h3 class="text-xl font-bold mb-4">📅 選擇日期</h3><input type="date" id="datePickerInput" class="date-picker-input" value="${dateKeyISO(currentDate)}" min="${dateKeyISO(firstSemesterStart)}" max="${dateKeyISO(secondSemesterEnd)}"><div class="flex gap-3"><button onclick="document.querySelector('.date-picker-overlay').remove()" class="flex-1 bg-gray-500 text-white py-2 rounded-lg">取消</button><button onclick="confirmDatePicker()" class="flex-1 bg-indigo-500 text-white py-2 rounded-lg">確認</button></div></div>`;
            document.body.appendChild(overlay);
        }

        async function confirmDatePicker() {
            const input = document.getElementById('datePickerInput');
            if (!input?.value) return showToast('請選擇有效日期！', 'warning');
            const d = new Date(input.value + 'T12:00:00');
            if (d < firstSemesterStart || d > secondSemesterEnd) return showToast('所選日期超出學期範圍！', 'warning');
            if (d.getDay() === 0 || d.getDay() === 6) return showToast('週末沒有上課，請選擇平日！', 'warning');
            
            currentDate = d; document.querySelector('.date-picker-overlay')?.remove();
            showToast('正在載入所選日期...', 'success'); await updateDateDisplay();
        }

        function showQRCode() {
            // 動態獲取目前網址並編碼
            const currentUrl = encodeURIComponent(window.location.href);
            // 透過外部輕量 API 產生 QR Code
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${currentUrl}`;
            
            const overlay = document.createElement('div');
            overlay.className = 'qrcode-overlay fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[10001] opacity-0 transition-opacity duration-300';
            overlay.onclick = (e) => { if (e.target === overlay) closeQRCode(overlay); };
            
            overlay.innerHTML = `
                <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col items-center relative max-w-sm mx-4">
                    <button onclick="closeQRCode(this.closest('.qrcode-overlay'))" class="absolute top-2 right-3 text-gray-400 hover:text-gray-600 text-3xl font-bold leading-none">&times;</button>
                    <h3 class="text-xl sm:text-2xl font-bold text-gray-800 mb-4 flex items-center"><span class="mr-2">📱</span> 行動裝置掃描</h3>
                    <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-4 relative min-h-[200px] flex items-center justify-center">
                        <div class="absolute inset-0 border-4 border-transparent border-t-indigo-500 rounded-full animate-spin w-8 h-8 m-auto" style="z-index: 1;"></div>
                        <img src="${qrUrl}" alt="QR Code" class="w-48 h-48 sm:w-56 sm:h-56 object-contain relative z-10" onload="this.previousElementSibling.style.display='none'">
                    </div>
                    <p class="text-sm text-gray-500 font-medium text-center">請使用手機或平板相機掃描<br>即可快速進入聯絡簿</p>
                </div>
            `;
            
            document.body.appendChild(overlay);
            
            // 觸發進場動畫
            requestAnimationFrame(() => {
                overlay.classList.remove('opacity-0');
                overlay.querySelector('div').classList.remove('scale-95');
                overlay.querySelector('div').classList.add('scale-100');
            });
        }

        function closeQRCode(overlay) {
            overlay.classList.add('opacity-0');
            overlay.querySelector('div').classList.remove('scale-100');
            overlay.querySelector('div').classList.add('scale-95');
            setTimeout(() => overlay.remove(), 300);
        }

        window.addEventListener('load', () => {
            currentDate = new Date();
            if (currentDate.getDay() === 0 || currentDate.getDay() === 6) moveDay(1); 
            else updateDateDisplay();
            
            loadGlobalEvents(); 
            startBackgroundUpdate();
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && !editMode) setTimeout(performBackgroundUpdate, 1000);
            });
        });
    </script>
