<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>僑平國小 605 聯絡簿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .homework-item {
            transition: all 0.3s ease;
        }
        .homework-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .sync-indicator {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .saving-overlay, .date-picker-overlay, .password-dialog-overlay, .marquee-list-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            animation: fadeIn 0.2s ease forwards;
        }
        @keyframes fadeIn { to { opacity: 1; } }
        
        .saving-dialog, .date-picker-dialog, .marquee-list-dialog {
            background: white;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            transform: scale(0.95);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn { to { transform: scale(1); } }
        
        .date-picker-dialog {
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .marquee-list-dialog {
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            text-align: left;
            padding: 1.5rem;
        }
        .date-picker-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .date-picker-input:focus { border-color: #6366f1; }
        
        .homework-confirmed { background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); border: 2px solid #10b981; }
        .homework-pending { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border: 2px solid #f59e0b; }
        .homework-editing { background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%); border: 2px solid #6b7280; }
        
        .sortable-item, .global-sortable-item { cursor: move; transition: transform 0.2s ease, opacity 0.2s ease; }
        .sortable-item:hover, .global-sortable-item:hover { transform: translateY(-1px); }
        .sortable-item.dragging, .global-sortable-item.dragging { opacity: 0.5; transform: rotate(2deg); z-index: 1000; }
        .sortable-item.drag-over { border-top: 3px solid #6366f1; }
        .global-sortable-item.drag-over { border-top: 3px solid #eab308; }
        .drag-handle, .global-drag-handle { cursor: grab; color: #9ca3af; transition: color 0.2s; }
        .drag-handle:hover { color: #6366f1; }
        .global-drag-handle:hover { color: #ca8a04; }
        .drag-handle:active, .global-drag-handle:active { cursor: grabbing; }
        
        .sort-mode-indicator {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 2px solid #f59e0b;
            border-radius: 12px;
            padding: 8px 16px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 600;
            color: #92400e;
        }

        /* 跑馬燈動畫 */
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
        }
        .marquee-wrapper {
            overflow: hidden;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .marquee-content {
            display: flex;
            white-space: nowrap;
            width: max-content;
            animation-name: scroll;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        .marquee-wrapper:hover .marquee-content { animation-play-state: paused; }
        .marquee-item-group {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            min-width: 100%;
        }
        
        /* 自訂通知動畫 */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .toast-notification {
            animation: slideInRight 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .toast-notification.hiding {
            animation: fadeOutRight 0.3s ease forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-2 sm:p-4">

    <script>
        let currentDate = new Date();
        let homeworkCounter = 0;
        let editMode = false;
        let homeworkData = []; 
        
        let globalConfig = { marqueeSpeed: 200, password: "0944" }; 
        let globalEvents = [];
        
        let currentGlobalDataString = null;
        let currentHomeworkHash = null;

        const firstSemesterStart = new Date('2026-08-31');
        const firstSemesterEnd = new Date('2027-01-20');
        const secondSemesterStart = new Date('2027-02-11');
        const secondSemesterEnd = new Date('2027-06-30');

        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQGDUGy9WWRTRYarvab7F-bFZBqeVaT2mhu4lC0L7OQ-iwoTUU1bexXJLSXaSfiil_Qg/exec';

        const CACHE_CONFIG = {
            CLASS_ID: '605',
            BACKGROUND_UPDATE_INTERVAL: 5000, 
            BACKGROUND_UPDATE_ENABLED: true 
        };

        let backgroundUpdateTimer = null;
        let isBackgroundUpdating = false;

        // -------------------------
        // Toast 通知系統 (取代 Alert)
        // -------------------------
        function showToast(message, type = 'success') {
            const containerId = 'toast-container';
            let container = document.getElementById(containerId);
            if (!container) {
                container = document.createElement('div');
                container.id = containerId;
                container.className = 'fixed top-4 right-4 z-[99999] flex flex-col gap-2 pointer-events-none';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
            const bgClass = type === 'success' ? 'bg-green-50 border-green-200 text-green-800' : 
                            type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : 
                            type === 'warning' ? 'bg-yellow-50 border-yellow-200 text-yellow-800' : 
                            'bg-blue-50 border-blue-200 text-blue-800';

            toast.className = `toast-notification pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border shadow-lg ${bgClass}`;
            toast.innerHTML = `<span class="text-xl">${icon}</span><span class="font-bold text-sm sm:text-base">${message}</span>`;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function dateKeyISO(d) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function parseRawData(rawData) {
            if (typeof rawData === 'string') {
                try { 
                    return JSON.parse(rawData); 
                } catch (e) {
                    let textBlocks = rawData.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                    return textBlocks.map(text => ({
                        content: text,
                        subject: '其它',
                        status: 'confirmed'
                    }));
                }
            }
            return rawData || [];
        }

        function calculateStableHash(parsedData) {
            if (!Array.isArray(parsedData)) return 'empty';
            const stableContent = parsedData.map(item => {
                if (typeof item === 'string') return item.trim();
                else if (item && typeof item === 'object') {
                    return (item.text || item.content || item.homework || '').toString().trim();
                }
                return null;
            }).filter(Boolean);
            const str = JSON.stringify(stableContent);
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash = hash & hash;
            }
            return hash.toString(36);
        }

        function generateStableId(subject, content, index) {
            const baseStr = `${subject}|${content}|${index}`;
            let hash = 0;
            for (let i = 0; i < baseStr.length; i++) {
                hash = ((hash << 5) - hash) + baseStr.charCodeAt(i);
                hash = hash & hash;
            }
            return `hw_${hash.toString(36)}`;
        }

        function normalizeHomeworkData(rawData) {
            let parsedData = parseRawData(rawData);
            if (!Array.isArray(parsedData)) return [];
            return parsedData.map((item, index) => {
                let content = '', subject = '國語', status = 'confirmed', timestamp = null;
                if (typeof item === 'string') { content = item.trim(); subject = '其它'; }
                else if (item && typeof item === 'object') {
                    content = (item.text || item.content || item.homework || '').toString().trim();
                    subject = item.subject || item.subj || '國語';
                    status = (item.confirmed === true || item.status === 'confirmed') ? 'confirmed' : (item.status === 'editing' ? 'editing' : 'confirmed');
                    timestamp = item.timestamp || item.time || null;
                }
                if (content) return new HomeworkItem(generateStableId(subject, content, index), subject, content, status, timestamp);
                return null;
            }).filter(Boolean);
        }

        class HomeworkItem {
            constructor(id, subject, content, status = 'editing', timestamp = null) {
                this.id = id || `hw_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                this.subject = subject || '國語';
                this.content = content || '';
                this.status = status;
                this.timestamp = timestamp || new Date().toISOString();
            }
        }

        async function performBackgroundUpdate() {
            if (isBackgroundUpdating || editMode) return;
            isBackgroundUpdating = true;
            
            try {
                const dateKey = dateKeyISO(currentDate);
                
                const hwParams = new URLSearchParams({ action: 'load', dateKey, classId: CACHE_CONFIG.CLASS_ID, token: 'homework2025', _t: Date.now() });
                const globalParams = new URLSearchParams({ action: 'loadGlobal', classId: CACHE_CONFIG.CLASS_ID, token: 'homework2025', _t: Date.now() });

                const [hwRes, gbRes] = await Promise.all([
                    fetch(`${APPS_SCRIPT_URL}?${hwParams.toString()}`).catch(()=>null),
                    fetch(`${APPS_SCRIPT_URL}?${globalParams.toString()}`).catch(()=>null)
                ]);

                if (hwRes && hwRes.ok && !editMode) {
                    const text = await hwRes.text();
                    if(!text.trim().startsWith('<')) {
                        const result = JSON.parse(text);
                        if (result.success || result.data) {
                            const rawData = result.data || [];
                            const parsed = parseRawData(rawData);
                            const newHash = calculateStableHash(parsed);
                            
                            if (newHash !== currentHomeworkHash && dateKeyISO(currentDate) === dateKey) {
                                currentHomeworkHash = newHash;
                                const activeElement = document.activeElement;
                                const activeId = activeElement?.closest('.homework-item')?.dataset?.homeworkId;
                                const cursorPos = activeElement?.selectionStart;
                                
                                homeworkData = normalizeHomeworkData(rawData);
                                renderAllHomework();
                                
                                if (activeId) {
                                    const newInput = document.querySelector(`[data-homework-id="${activeId}"] input[type="text"]`);
                                    if (newInput) {
                                        newInput.focus();
                                        if (cursorPos !== undefined) newInput.setSelectionRange(cursorPos, cursorPos);
                                    }
                                }
                            }
                        }
                    }
                }

                if (gbRes && gbRes.ok && !editMode) {
                    const result = await gbRes.json();
                    if (result.success && result.data) {
                        const fetchedString = typeof result.data === 'string' ? result.data : JSON.stringify(result.data);
                        if (currentGlobalDataString !== null && currentGlobalDataString !== fetchedString) {
                            applyGlobalData(result.data);
                        }
                    }
                }
            } catch (error) {
                // Background update errors are ignored silently
            } finally {
                isBackgroundUpdating = false;
            }
        }

        let draggedElement = null, draggedHomeworkId = null;
        function handleDragStart(e) {
            const item = e.target.closest('.sortable-item');
            if (!item) return;
            draggedElement = item; draggedHomeworkId = item.dataset.homeworkId;
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', draggedHomeworkId);
        }
        function handleDragEnd(e) {
            if (draggedElement) {
                draggedElement.classList.remove('dragging');
                draggedElement.setAttribute('draggable', 'false'); 
            }
            document.querySelectorAll('.sortable-item').forEach(i => i.classList.remove('drag-over'));
            draggedElement = null; draggedHomeworkId = null;
        }
        function handleDragOver(e) {
            e.preventDefault(); e.stopPropagation();
            if (!draggedElement) return;
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.sortable-item');
            if (target && target !== draggedElement) {
                document.querySelectorAll('.sortable-item').forEach(i => i.classList.remove('drag-over'));
                target.classList.add('drag-over');
            }
        }
        function handleDrop(e) {
            e.preventDefault(); e.stopPropagation();
            if (!draggedElement || !draggedHomeworkId) return;
            const target = e.target.closest('.sortable-item');
            if (target && target !== draggedElement) {
                const targetId = target.dataset.homeworkId;
                const draggedIdx = homeworkData.findIndex(hw => hw.id === draggedHomeworkId);
                const targetIdx = homeworkData.findIndex(hw => hw.id === targetId);
                if (draggedIdx > -1 && targetIdx > -1) {
                    const item = homeworkData.splice(draggedIdx, 1)[0];
                    homeworkData.splice(targetIdx, 0, item);
                    item.timestamp = new Date().toISOString();
                    renderAllHomework();
                }
            }
            document.querySelectorAll('.sortable-item').forEach(i => i.classList.remove('drag-over'));
        }

        let draggedGlobalElement = null;
        let draggedGlobalEventId = null;

        function handleGlobalDragStart(e) {
            const item = e.target.closest('.global-sortable-item');
            if (!item) return;
            draggedGlobalElement = item;
            draggedGlobalEventId = item.dataset.eventId;
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', draggedGlobalEventId);
        }
        function handleGlobalDragEnd(e) {
            if (draggedGlobalElement) {
                draggedGlobalElement.classList.remove('dragging');
                draggedGlobalElement.setAttribute('draggable', 'false');

            document.querySelectorAll('.global-sortable-item').forEach(i => i.classList.remove('drag-over'));

        function handleGlobalDrop(e) {

            if (!draggedGlobalElement || !draggedGlobalEventId) return;
            const target = e.target.closest('.global-sortable-item');
            if (target && target !== draggedGlobalElement) {

        async function saveGlobalEventsInstantly() {
            try {
                const dataToSave = { events: globalEvents, config: globalConfig };
                const formData = new FormData();
                formData.append('action', 'saveGlobal');
                formData.append('classId', CACHE_CONFIG.CLASS_ID);
                formData.append('data', JSON.stringify(dataToSave));
                formData.append('token', 'homework2025');

                fetch(APPS_SCRIPT_URL, { method: 'POST', body: formData, cache: 'no-store' }).catch(()=>{});
                currentGlobalDataString = JSON.stringify(dataToSave);
            } catch (e) {}
        }

        function applyGlobalData(parsedData) {
            const safeObj = (parsedData && typeof parsedData === 'object' && !Array.isArray(parsedData)) ? parsedData : {};
            currentGlobalDataString = JSON.stringify(parsedData);

            if (safeObj.events) globalEvents = safeObj.events;
            if (safeObj.config) {
                globalConfig = safeObj.config;
                let speed = parseInt(globalConfig.marqueeSpeed, 10);
                globalConfig.marqueeSpeed = (isNaN(speed) || speed < 150) ? 200 : (speed > 400 ? 400 : speed);
            }

            updateCountdown(new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()).getTime());
            
            if (editMode) {
                renderGlobalEventsEditor();
                const slider = document.getElementById('marqueeSpeedSlider');
                const display = document.getElementById('speedValueDisplay');
                if (slider && display) {
                    slider.value = globalConfig.marqueeSpeed;
                    display.textContent = globalConfig.marqueeSpeed + 's';
                }
            }
        }

        async function loadGlobalEvents() {
            try {
                const params = new URLSearchParams({ action: 'loadGlobal', classId: CACHE_CONFIG.CLASS_ID, token: 'homework2025', _t: Date.now() });
                const response = await fetch(`${APPS_SCRIPT_URL}?${params.toString()}`);
                if (!response.ok) return;
                
                const result = await response.json();
                if (result.success && result.data) {
                    applyGlobalData(parseRawData(result.data));
                }
            } catch (e) {}
        }

        async function saveToGoogleSheets(dateKey, data) {
            try {
                const formData = new FormData();
                formData.append('action', 'save');
                formData.append('dateKey', dateKey); 
                formData.append('classId', CACHE_CONFIG.CLASS_ID);
                formData.append('data', JSON.stringify(data));
                formData.append('token', 'homework2025');
                formData.append('userAgent', navigator.userAgent || "Unknown Browser");

                fetch(APPS_SCRIPT_URL, { method: 'POST', body: formData, cache: 'no-store' }).catch(()=>{});
                return { success: true };
            } catch (e) { return { success: false, message: e.message }; }
        }

        async function loadHomework(isManual = false) { 
            if(isManual) renderAllHomework(true);
            const dateKey = dateKeyISO(currentDate);
            try {
                const params = new URLSearchParams({ action: 'load', dateKey, classId: CACHE_CONFIG.CLASS_ID, token: 'homework2025', _t: Date.now() });
                const response = await fetch(`${APPS_SCRIPT_URL}?${params.toString()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error();
                
                const text = await response.text();
                if(text.trim().startsWith('<')) {
                    if (isManual) showToast('後端發生錯誤，請檢查GAS權限設定', 'error');
                    renderAllHomework();
                    return;
                }
                
                const result = JSON.parse(text);
                if (result.success || result.data) {
                    let rawData = result.data || [];
                    const parsed = parseRawData(rawData);
                    currentHomeworkHash = calculateStableHash(parsed);
                    if (dateKeyISO(currentDate) === dateKey) { 
                        homeworkData = normalizeHomeworkData(rawData); 
                        renderAllHomework(); 
                    }
                }
            } catch (e) {
                if (dateKeyISO(currentDate) === dateKey) { homeworkData = []; renderAllHomework(); }
            }
        }

            showToast('同步中...', 'success');
            const btn = document.getElementById('refreshBtn');
            const icon = btn.querySelector('.text-sm');
            if (icon) icon.classList.add('animate-spin');
            
            try {
                await Promise.all([loadHomework(true), loadGlobalEvents()]);
                showToast('已更新為最新資料', 'success');
            } catch(e) {
                showToast('更新失敗，請檢查網路狀態', 'error');
            } finally {
                if (icon) icon.classList.remove('animate-spin');
            }
        }

        async function saveHomeworkInstantly() {
            const dateKey = dateKeyISO(currentDate);
            const legacyData = homeworkData.map(hw => ({ text: hw.content, subject: hw.subject, confirmed: hw.status === 'confirmed', timestamp: hw.timestamp }));
            currentHomeworkHash = calculateStableHash(legacyData);
            return saveToGoogleSheets(dateKey, legacyData);
        }

                <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-2xl max-w-sm w-full mx-4 transform scale-95 pop-animation">
                    <div class="text-4xl mb-4">🔐</div>
                    <h3 class="text-xl font-bold text-slate-800 text-center mb-6">身分驗證</h3>
                    <input type="password" id="customPasswordInput" placeholder="請輸入密碼..." class="w-full border-2 border-slate-200 focus:border-indigo-500 rounded-xl p-3 text-center text-lg font-bold mb-6 outline-none transition-colors shadow-inner">
                    <div class="flex gap-3">
                        <button onclick="document.querySelector('.password-dialog-overlay').remove()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold transition-colors">取消</button>
                        <button onclick="confirmPassword()" class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white py-3 rounded-xl font-bold transition-colors shadow-md">登入</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            setTimeout(() => { const i = document.getElementById('customPasswordInput'); i.focus(); i.onkeypress = e => { if(e.key==='Enter') confirmPassword(); }; }, 50);
        }

        function confirmPassword() {
            const input = document.getElementById('customPasswordInput');
            const targetPass = globalConfig.password || "0944";
            if (input?.value === targetPass) {
                editMode = true; updateEditModeUI(); document.querySelector('.password-dialog-overlay').remove();
                showToast('已進入編輯模式', 'success'); renderAllHomework();
            } else { 
                showToast('密碼錯誤！請重試', 'error'); 
                input.value = ''; input.focus(); 
                input.parentElement.classList.add('animate-bounce');
                setTimeout(()=>input.parentElement.classList.remove('animate-bounce'), 500);
            }
        }

        function showMarqueeList() {
            if (!globalEvents || globalEvents.length === 0) return showToast('目前沒有跑馬燈訊息', 'warning');
            
            const overlay = document.createElement('div');
            overlay.className = 'marquee-list-overlay';
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
            
            let listHTML = globalEvents.filter(ev => ev.enabled !== false).map(ev => {
                if (ev.type === 'message' && ev.content?.trim()) {
                    return `<div class="p-3 bg-slate-50 border border-slate-200 rounded-lg mb-2 shadow-sm flex items-start"><span class="text-xl mr-3">📢</span><div class="font-bold text-slate-700 mt-0.5">${ev.content}</div></div>`;
                } else if (ev.type === 'countdown' && ev.date && ev.name) {
                    const [y, m, d] = ev.date.split('-');
                    const evDate = new Date(parseInt(y), parseInt(m)-1, parseInt(d), 12, 0, 0).getTime();
                    const eDay = new Date(new Date(evDate).getFullYear(), new Date(evDate).getMonth(), new Date(evDate).getDate()).getTime();
                    const tDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()).getTime();
                    
                    if (eDay >= tDay) {
                        const days = Math.floor((eDay - tDay) / 86400000);
                        const dayStr = days === 0 ? '<span class="text-red-500">就是今天！</span>' : `還有 <span class="text-2xl text-red-500 font-black mx-1">${days}</span> 天`;
                        return `<div class="p-4 bg-yellow-50 border border-yellow-200 rounded-lg mb-2 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center relative overflow-hidden">
                                    <div class="absolute -right-4 -top-4 text-6xl opacity-10">🗓️</div>
                                    <div class="flex items-center z-10"><span class="text-2xl mr-3">🌟</span><div class="font-bold text-yellow-900 text-lg">${ev.name}</div></div>
                                    <div class="mt-2 sm:mt-0 z-10 flex flex-col items-end w-full sm:w-auto">
                                        <div class="text-sm font-bold text-yellow-600 bg-yellow-100 px-2 py-0.5 rounded mb-1">${y}/${m}/${d}</div>
                                        <div class="font-bold text-yellow-800">${dayStr}</div>
                                    </div>
                                </div>`;
                    }
                }
                return '';
            }).join('');
            
            if(!listHTML) listHTML = '<div class="text-center text-slate-500 py-4 font-bold">目前沒有生效的訊息</div>';
            
            overlay.innerHTML = `
                <div class="marquee-list-dialog relative flex flex-col">
                    <button onclick="document.querySelector('.marquee-list-overlay').remove()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-3xl font-bold leading-none bg-slate-100 rounded-full w-10 h-10 flex items-center justify-center transition-colors">×</button>
                    <h3 class="text-2xl font-bold mb-6 text-slate-800 flex items-center"><span class="mr-2">📋</span> 跑馬燈與活動列表</h3>
                    <div class="overflow-y-auto max-h-[60vh] pr-2 custom-scrollbar">
                        ${listHTML}
                    </div>
                </div>`;
            document.body.appendChild(overlay);
        }

        function updateCountdown(currentDayTime) {
            const countdownMarquee = document.getElementById('countdownMarquee');
            const marqueeText = document.getElementById('marqueeText');
            if (!globalEvents || globalEvents.length === 0) { countdownMarquee.style.display = 'none'; return; }

            let msgs = [];
            for (const ev of globalEvents) {
                if (ev.enabled === false) continue;
                if (ev.type === 'message' && ev.content?.trim()) { msgs.push(`📢 ${ev.content}`); } 
                else if (ev.type === 'countdown' && ev.date && ev.name) {
                    const [y, m, d] = ev.date.split('-');
                    const evDate = new Date(parseInt(y), parseInt(m)-1, parseInt(d), 12, 0, 0).getTime();
                    const eDay = new Date(new Date(evDate).getFullYear(), new Date(evDate).getMonth(), new Date(evDate).getDate()).getTime();
                    const tDay = new Date(new Date(currentDayTime).getFullYear(), new Date(currentDayTime).getMonth(), new Date(currentDayTime).getDate()).getTime();
                    if (eDay >= tDay) {
                        const days = Math.floor((eDay - tDay) / 86400000);
                        if (days === 0) msgs.push(`📢 🌟 提醒：【${ev.name}】就是今天！祝大家順利！ 💪 🌟`);
                        else msgs.push(`📢 提醒：距離【${ev.name}】還剩下 <span class="text-2xl text-red-500 font-black mx-2">${days}</span> 天！`);
                    }
                }
            }

            if (msgs.length > 0) {
                countdownMarquee.style.display = 'flex';
                const baseMsg = msgs.join('<span class="mx-8 text-yellow-400 font-normal opacity-50">|</span>') + '<span class="mx-8 text-yellow-400 font-normal opacity-50">|</span>';
                const charCount = baseMsg.replace(/<[^>]*>?/gm, '').length || 1;
                const copies = 20;
                const speedSetting = Math.max(150, Math.min(400, globalConfig.marqueeSpeed || 200));
                const calculatedDuration = ((charCount * (copies/2)) / 300) * speedSetting;

                const repeatedMsg = Array(copies).fill(baseMsg).join('');
                const groupHTML = `<div class="marquee-item-group px-4">${repeatedMsg}</div>`;
                
                marqueeText.className = 'marquee-content text-base sm:text-lg font-bold text-yellow-800';
                marqueeText.style.animationDuration = `${calculatedDuration}s`;
                marqueeText.innerHTML = groupHTML + groupHTML;
            } else { countdownMarquee.style.display = 'none'; }
        }

        function updateDateDisplaySync() {
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            let semInfo = '', weekNum = 1;
            const stripTime = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
            const curr = stripTime(currentDate), s1Start = stripTime(firstSemesterStart), s1End = stripTime(firstSemesterEnd), s2Start = stripTime(secondSemesterStart), s2End = stripTime(secondSemesterEnd);

            if (curr >= s1Start && curr <= s1End) {
                semInfo = '115學年第一學期';
                weekNum = Math.max(1, Math.min(21, Math.floor((curr - new Date(2026, 7, 30).getTime()) / 86400000 / 7) + 1));
            } else if (curr >= s2Start && curr <= s2End) {
                semInfo = '115學年第二學期';
                weekNum = Math.max(1, Math.min(21, Math.floor((curr - new Date(2027, 1, 7).getTime()) / 86400000 / 7) + 1));
            } else if (curr < s1Start) { semInfo = '115學年第一學期前'; } 
            else if (curr > s1End && curr < s2Start) { semInfo = '115學年寒假'; } 
            else { semInfo = '115學年暑假'; }

            document.getElementById('semesterInfo').textContent = semInfo;
            document.getElementById('weekInfo').textContent = `第${weekNum}週`;
            
            const month = currentDate.getMonth() + 1;
            const date = currentDate.getDate();
            document.getElementById('dateOnly').textContent = `${currentDate.getFullYear()}年${month}月${date}日`;
            document.getElementById('weekdayOnly').textContent = weekdays[currentDate.getDay()];
            
            const titleDate = new Date();
            if(stripTime(titleDate) === curr) {
                document.getElementById('homeworkTitle').textContent = `今日作業`;
            } else {
                document.getElementById('homeworkTitle').textContent = `${month}月${date}日 作業`;
            }
            
            updateCountdown(curr);
        }

        function updateDateDisplay() {
            updateDateDisplaySync();
            requestAnimationFrame(() => loadHomework().catch(()=>null));
        }

        let navLocked = false;
        function moveDay(step) {
            if (navLocked) return; navLocked = true; setTimeout(() => navLocked = false, 300);
            do {
                currentDate.setDate(currentDate.getDate() + step);
                if (currentDate < firstSemesterStart) { currentDate = new Date(firstSemesterStart); break; }
                if (currentDate > secondSemesterEnd) { currentDate = new Date(secondSemesterEnd); break; }
            } while (currentDate.getDay() === 0 || currentDate.getDay() === 6);
            updateDateDisplay();
        }
        function previousDay() { moveDay(-1); }
        function nextDay() { moveDay(1); }
        function today() {
            if (navLocked) return; navLocked = true; setTimeout(() => navLocked = false, 300);
            currentDate = new Date(); updateDateDisplay();
        }

        function showDatePicker() {
            const overlay = document.createElement('div'); overlay.className = 'date-picker-overlay';
            overlay.innerHTML = `<div class="date-picker-dialog"><h3 class="text-xl font-bold mb-4 text-slate-800">📅 選擇日期</h3><input type="date" id="datePickerInput" class="date-picker-input font-bold text-slate-700" value="${dateKeyISO(currentDate)}" min="${dateKeyISO(firstSemesterStart)}" max="${dateKeyISO(secondSemesterEnd)}"><div class="flex gap-3"><button onclick="document.querySelector('.date-picker-overlay').remove()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold transition-colors">取消</button><button onclick="confirmDatePicker()" class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white py-3 rounded-xl font-bold transition-colors shadow-md">確認</button></div></div>`;
            document.body.appendChild(overlay);
        }

        async function confirmDatePicker() {
            const input = document.getElementById('datePickerInput');
            if (!input?.value) return showToast('請選擇有效日期！', 'warning');
            const d = new Date(input.value + 'T12:00:00');
            if (d < firstSemesterStart || d > secondSemesterEnd) return showToast('所選日期超出學期範圍！', 'error');
            if (d.getDay() === 0 || d.getDay() === 6) return showToast('週末沒有上課，請選擇平日！', 'warning');
            
            currentDate = d; document.querySelector('.date-picker-overlay')?.remove();
            showToast(`已跳轉至 ${d.getMonth()+1}/${d.getDate()}`, 'success'); await updateDateDisplay();
        }

        window.addEventListener('load', () => {
            currentDate = new Date();
            updateDateDisplay();
            loadGlobalEvents(); 
            startBackgroundUpdate();
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && !editMode) setTimeout(performBackgroundUpdate, 1000);
            });
        });
    </script>
</body>
</html>
